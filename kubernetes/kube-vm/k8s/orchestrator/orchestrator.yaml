---
apiVersion: v1
kind: Namespace
metadata:
  name: orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qos-orchestrator
  namespace: orchestrator
  labels:
    app: qos-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qos-orchestrator
  template:
    metadata:
      labels:
        app: qos-orchestrator
    spec:
      hostNetwork: true
      containers:
        - name: orchestrator
          image: qos-orchestrator:local
          imagePullPolicy: Never
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          ports:
            - containerPort: 9200
              name: metrics
          readinessProbe:
            httpGet:
              path: /health
              port: 9200
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9200
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: qos-orchestrator
  namespace: orchestrator
spec:
  type: ClusterIP
  selector:
    app: qos-orchestrator
  ports:
    - port: 9200
      targetPort: 9200
      name: metrics
