"id\":\"color\",\"value\":{\"fixedColor\":\"#5794F2\",\"mode\":\"fixed\"}}]},\n         {\"matcher\":{\"id\":\"byName\",\"options\":\"urllc\"},\"properties\":[{\"id\":\"color\",\"value\":{\"fixedColor\":\"#FF6B6B\",\"mode\":\"fixed\"}}]},\n         {\"matcher\":{\"id\":\"byName\",\"options\":\"mmtc\"},\"properties\":[{\"id\":\"color\",\"value\":{\"fixedColor\":\"#73BF69\",\"mode\":\"fixed\"}}]}]},\n     \"targets\":[{\"expr\":\"sum by(namespace)(rate(container_cpu_usage_seconds_total{namespace=~\\\"embb|urllc|mmtc\\\"}[1m]))\",\"legendFormat\":\"{{namespace}}\",\"refId\":\"A\"}],\n     \"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"}}\n\n  ,{\"type\":\"row\",\"title\":\"▶ LLM \u0026 AGENTIC CONTROL\",\"gridPos\":{\"h\":1,\"w\":24,\"x\":0,\"y\":46},\"collapsed\":false},{\"title\":\"Agentic Mode\",\"type\":\"stat\",\"gridPos\":{\"h\":4,\"w\":3,\"x\":0,\"y\":47},\"fieldConfig\":{\"defaults\":{\"color\":{\"mode\":\"thresholds\"},\"thresholds\":{\"steps\":[{\"color\":\"blue\",\"value\":null},{\"color\":\"green\",\"value\":1}]}}},\"options\":{\"reduceOptions\":{\"calcs\":[\"lastNotNull\"]},\"textMode\":\"value\"},\"targets\":[{\"expr\":\"orchestrator_agentic_mode\",\"refId\":\"A\"}],\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"}},{\"title\":\"LLM Latency\",\"type\":\"stat\",\"gridPos\":{\"h\":4,\"w\":3,\"x\":3,\"y\":47},\"fieldConfig\":{\"defaults\":{\"unit\":\"ms\",\"color\":{\"mode\":\"thresholds\"},\"thresholds\":{\"steps\":[{\"color\":\"green\",\"value\":null},{\"color\":\"yellow\",\"value\":30000},{\"color\":\"red\",\"value\":60000}]}}},\"options\":{\"reduceOptions\":{\"calcs\":[\"lastNotNull\"]}},\"targets\":[{\"expr\":\"orchestrator_llm_latency_ms\",\"refId\":\"A\"}],\"datasource\":{\"type\":\"prometheus\",\"uid\":\"PBFA97CFB590B2093\"}},{\"title\":\"LLM Confidence\",\"type\":\"gauge\",\"gridPos\":{\"h\":4,\"w\":3,\"x\":6,\"y\":47},\"fieldConfig\":{\"defaults\":{\"unit\":\"percentunit\",\"min\":0,\"max\":1,\"color\":{\"