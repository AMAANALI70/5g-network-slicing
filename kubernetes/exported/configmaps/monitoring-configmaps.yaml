      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"exporter.py":"#!/usr/bin/env python3\n\"\"\"\nPrometheus exporter for ogstun-* TUN interface statistics AND\ntc qdisc stats (netem delay, backlog, HTB rate).\nReads counters from /sys/class/net/\u003ciface\u003e/statistics/ and\ntc -s qdisc show, then serves them as Prometheus metrics on port 9100.\n\"\"\"\nimport http.server\nimport os\nimport re\nimport subprocess\n\nPORT = 9100\n\n# Map interface names to slice labels\nINTERFACE_MAP = {\n    \"ogstun-embb\": \"embb\",\n    \"ogstun-urllc\": \"urllc\",\n    \"ogstun-mmtc\": \"mmtc\",\n}\n\nSTATS = [\n    \"rx_bytes\", \"tx_bytes\",\n    \"rx_packets\", \"tx_packets\",\n    \"rx_errors\", \"tx_errors\",\n    \"rx_dropped\", \"tx_dropped\",\n]\n\ndef read_stat(iface, stat):\n    path = f\"/sys/class/net/{iface}/statistics/{stat}\"\n    try:\n        with open(path) as f:\n            return int(f.read().strip())\n    except (FileNotFoundError, ValueError):\n        return 0\n\ndef collect_tc_stats(iface, slice_name):\n    \"\"\"Run tc -s qdisc show dev \u003ciface\u003e and parse netem delay + backlog.\"\"\"\n    lines = []\n    try:\n        out = subprocess.check_output(\n            [\"nsenter\", \"--target\", \"1\", \"--mount\", \"--\",\n             \"tc\", \"-s\", \"qdisc\", \"show\", \"dev\", iface],\n            text=True, timeout=2, stderr=subprocess.DEVNULL,\n        )\n        # Parse netem delay\n        m = re.search(r'delay\\s+([\\d.]+)(ms|us|s)', out)\n        if m:\n            val, unit = float(m.group(1)), m.group(2)\n            if unit == \"us\":\n                val = val / 1000.0\n            elif unit == \"s\":\n                val = val * 1000.0\n            lines.append(\n                f'tc_netem_delay_ms{{interface=\"{iface}\",slice=\"{slice_name}\"}} {val:.2f}'\n            )\n\n        # Parse backlog packets\n        m = re.search(r'backlog\\s+\\S+\\s+(\\d+)p', out)\n        if m:\n            lines.append(\n                f'tc_qdisc_backlog_packets{{interface=\"{iface}\",slice=\"{slice_name}\"}} {m.group(1)}'\n            )\n\n        # Parse HTB rate (e.g. \"rate 100Mbit\")\n        m = re.search(r'rate\\s+(\\d+)([MmKk]?)bit', out)\n        if m:\n            rate_val = int(m.group(1))\n            unit = m.group(2).upper()\n            if unit == \"K\":\n                rate_val = rate_val / 1000\n            lines.append(\n                f'tc_htb_rate_mbit{{interface=\"{iface}\",slice=\"{slice_name}\"}} {rate_val}'\n            )\n\n        # Parse total sent bytes from the first qdisc line\n        m = re.search(r'Sent\\s+(\\d+)\\s+bytes', out)\n        if m:\n            lines.append(\n                f'tc_qdisc_sent_bytes{{interface=\"{iface}\",slice=\"{slice_name}\"}} {m.group(1)}'\n            )\n\n        # Parse dropped from qdisc\n        m = re.search(r'dropped\\s+(\\d+)', out)\n        if m:\n            lines.append(\n                f'tc_qdisc_dropped{{interface=\"{iface}\",slice=\"{slice_name}\"}} {m.group(1)}'\n            )\n\n    except Exception:\n        pass\n    return lines\n\ndef collect_metrics():\n    lines = []\n    for iface, slice_name in INTERFACE_MAP.items():\n        if not os.path.exists(f\"/sys/class/net/{iface}\"):\n            continue\n        # sysfs counters\n        for stat in STATS:\n            value = read_stat(iface, stat)\n            metric_name = f\"tun_{stat}\"\n            lines.append(\n                f'{metric_name}{{interface=\"{iface}\",slice=\"{slice_name}\"}} {value}'\n            )\n        # tc qdisc stats\n        lines.extend(collect_tc_stats(iface, slice_name))\n\n    # Also read overall ens33 stats for reference\n    ens33_path = \"/sys/class/net/ens33/statistics\"\n    if os.path.exists(ens33_path):\n        for stat in [\"rx_bytes\", \"tx_bytes\", \"rx_packets\", \"tx_packets\"]:\n            value = read_stat(\"ens33\", stat)\n            lines.append(\n                f'host_net_{stat}{{interface=\"ens33\"}} {value}'\n            )\n\n    return \"\\n\".join(lines) + \"\\n\"\n\nclass MetricsHandler(http.server.BaseHTTPRequestHandler):\n    def do_GET(self):\n        if self.path == \"/metrics\":\n            body = collect_metrics().encode()\n            self.send_response(200)\n            self.send_header(\"Content-Type\", \"text/plain; version=0.0.4\")\n            self.send_header(\"Content-Length\", str(len(body)))\n            self.end_headers()\n            self.wfile.write(body)\n        elif self.path == \"/health\":\n            self.send_response(200)\n            self.send_header(\"Content-Type\", \"text/plain\")\n            self.end_headers()\n            self.wfile.write(b\"ok\\n\")\n        else:\n            self.send_response(404)\n            self.end_headers()\n\n    def log_message(self, format, *args):\n        pass  # Suppress request logs\n\nif __name__ == \"__main__\":\n    print(f\"[tun-exporter] Starting on port {PORT}\")\n    server = http.server.HTTPServer((\"0.0.0.0\", PORT), MetricsHandler)\n    server.serve_forever()\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"tun-exporter-script","namespace":"monitoring"}}
