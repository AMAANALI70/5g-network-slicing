    index.html: |
      <!DOCTYPE html>
      <html>
      <head><title>eMBB Slice - 5G Edge Content Server</title></head>
      <body>
      <h1>eMBB Slice Content Delivery</h1>
      <p>Slice: Enhanced Mobile Broadband (SST:1, DNN:internet)</p>
      <p>UE Subnet: 10.45.0.0/16 &rarr; 192.168.49.171 (kube worker)</p>
      <p>QoS: High throughput, moderate latency</p>
      </body>
      </html>
