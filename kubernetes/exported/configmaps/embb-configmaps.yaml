    resourceVersion: "56757"
    uid: 8f004537-45b0-4f4b-bc2c-3d3bd9f03238
- apiVersion: v1
  data:
    default.conf: |
      server {
          listen 8080;
          server_name _;
          root /usr/share/nginx/html;

          # HLS streaming headers
          location /hls/ {
              types {
                  application/vnd.apple.mpegurl m3u8;
                  video/mp2t ts;
              }
              add_header Cache-Control no-cache;
              add_header Access-Control-Allow-Origin *;
              add_header X-Slice-Type eMBB;
              # Enable byte-range for segment fetching
              add_header Accept-Ranges bytes;
          }

          # Status endpoint for monitoring
          location /status {
              stub_status on;
              access_log off;
          }

          # Health check
          location /healthz {
              return 200 "eMBB HLS OK\n";
              add_header Content-Type text/plain;
          }
      }
  kind: ConfigMap
  metadata:
