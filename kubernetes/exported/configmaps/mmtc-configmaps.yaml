- apiVersion: v1
  data:
    mosquitto.conf: |
      listener 1883 0.0.0.0
      listener 9001 0.0.0.0
      protocol websockets
      allow_anonymous true
      persistence false
      log_type error
      log_type warning
      log_type information
      # Enable $SYS topics for monitoring
      sys_interval 10
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"mosquitto.conf":"listener 1883 0.0.0.0\nlistener 9001 0.0.0.0\nprotocol websockets\nallow_anonymous true\npersistence false\nlog_type error\nlog_type warning\nlog_type information\n# Enable $SYS topics for monitoring\nsys_interval 10\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"mosquitto-config","namespace":"mmtc"}}
