- apiVersion: v1
  data:
    flows.json: |
      [
        {
          "id": "flow-mmtc-main",
          "type": "tab",
          "label": "mMTC IoT Processing"
        },
        {
          "id": "mqtt-broker-config",
          "type": "mqtt-broker",
          "name": "Mosquitto Local",
          "broker": "mmtc-app",
          "port": "1883",
          "clientid": "nodered-mmtc-processor",
          "autoConnect": true,
          "usetls": false,
          "keepalive": "60",
          "cleansession": true
        },
        {
          "id": "mqtt-sub-sensors",
          "type": "mqtt in",
          "z": "flow-mmtc-main",
          "name": "All Sensor Data",
          "topic": "sensors/#",
          "qos": "1",
          "broker": "mqtt-broker-config",
          "x": 130,
          "y": 120,
          "wires": [["parse-sensor"]]
        },
        {
          "id": "mqtt-sub-vehicles",
          "type": "mqtt in",
          "z": "flow-mmtc-main",
          "name": "Vehicle Telemetry",
          "topic": "vehicles/#",
          "qos": "1",
          "broker": "mqtt-broker-config",
          "x": 130,
          "y": 200,
          "wires": [["parse-sensor"]]
        },
        {
          "id": "mqtt-sub-heartbeat",
          "type": "mqtt in",
          "z": "flow-mmtc-main",
          "name": "Device Heartbeats",
          "topic": "devices/heartbeat/#",
          "qos": "0",
          "broker": "mqtt-broker-config",
          "x": 130,
          "y": 280,
          "wires": [["count-heartbeats"]]
        },
        {
          "id": "parse-sensor",
          "type": "function",
          "z": "flow-mmtc-main",
          "name": "Parse + Tag",
          "func": "try {\n  var d = typeof msg.payload === 'string' ? JSON.parse(msg.payload) : msg.payload;\n  d._topic = msg.topic;\n  d._ts = Date.now();\n  d._slice = 'mmtc';\n  msg.payload = d;\n} catch(e) {\n  msg.payload = {raw: msg.payload, error: e.message, _ts: Date.now()};\n}\nreturn msg;",
          "outputs": 1,
          "x": 360,
          "y": 160,
          "wires": [["influx-write", "debug-sensor"]]
        },
        {
          "id": "count-heartbeats",
          "type": "function",
          "z": "flow-mmtc-main",
          "name": "Track Devices",
          "func": "context.set('last_hb_' + msg.topic, Date.now());\nmsg.payload = {device: msg.topic, ts: Date.now()};\nreturn msg;",
          "outputs": 1,
          "x": 360,
          "y": 280,
          "wires": [["debug-sensor"]]
        },
        {
          "id": "influx-write",
          "type": "debug",
          "z": "flow-mmtc-main",
          "name": "Telemetry Store (InfluxDB)",
          "active": true,
          "tosidebar": true,
          "console": false,
          "tostatus": false,
          "complete": "payload",
          "x": 600,
          "y": 160,
          "wires": []
        },
        {
          "id": "debug-sensor",
          "type": "debug",
          "z": "flow-mmtc-main",
          "name": "Sensor Debug",
          "active": false,
          "x": 600,
          "y": 280,
          "wires": []
        }
      ]
    settings.js: |
      module.exports = {
          uiPort: 1880,
          flowFile: 'flows.json',
          userDir: '/data',
          httpAdminRoot: '/',
          httpNodeRoot: '/api',
          logging: { console: { level: "warn" } },
          editorTheme: { page: { title: "mMTC — IoT Telemetry Processor" } }
      }
  kind: ConfigMap
  metadata:
