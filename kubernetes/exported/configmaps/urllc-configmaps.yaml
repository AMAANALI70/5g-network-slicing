\"wires\": []\n  },\n  {\n    \"id\": \"http-in\",\n    \"type\": \"http in\",\n    \"z\": \"flow-urllc-main\",\n    \"name\": \"Telemetry POST\",\n    \"url\": \"/telemetry\",\n    \"method\": \"post\",\n    \"x\": 140,\n    \"y\": 300,\n    \"wires\": [[\"http-parse\"]]\n  },\n  {\n    \"id\": \"http-parse\",\n    \"type\": \"function\",\n    \"z\": \"flow-urllc-main\",\n    \"name\": \"HTTP Control Response\",\n    \"func\": \"try {\\n  var d = (typeof msg.payload === 'string') ? JSON.parse(msg.payload) : msg.payload;\\n  var now = Date.now();\\n  var cmd = 'HOLD';\\n  if (d.spindle_rpm \u003e 3040) cmd = 'REDUCE_SPEED';\\n  else if (d.spindle_rpm \u003c 2960) cmd = 'INCREASE_SPEED';\\n  if (d.vibration_x \u0026\u0026 Math.abs(d.vibration_x) \u003e 0.03) cmd = 'EMERGENCY_STOP';\\n  msg.payload = {control_cmd: cmd, server_ts: now, machine_id: d.machine_id || 'unknown', status: 'OK'};\\n  msg.statusCode = 200;\\n} catch(e) {\\n  msg.payload = {control_cmd: 'HOLD', status: 'PARSE_ERROR'};\\n  msg.statusCode = 200;\\n}\\nreturn msg;\",\n    \"outputs\": 1,\n    \"x\": 370,\n    \"y\": 300,\n    \"wires\": [[\"http-response\"]]\n  },\n  {\n    \"id\": \"http-response\",\n    \"type\": \"http response\",\n    \"z\": \"flow-urllc-main\",\n    \"name\": \"Send Response\",\n    \"statusCode\": \"\",\n    \"x\": 610,\n    \"y\": 300,\n    \"wires\": []\n  },\n  {\n    \"id\": \"status-inject\",\n    \"type\": \"inject\",\n    \"z\": \"flow-urllc-main\",\n    \"name\": \"Server Heartbeat\",\n    \"props\": [{\"p\": \"payload\"}],\n    \"repeat\": \"5\",\n    \"payload\": \"{\\\"type\\\":\\\"heartbeat\\\",\\\"server\\\":\\\"urllc-edge\\\",\\\"slice\\\":\\\"urllc\\\"}\",\n    \"payloadType\": \"str\",\n    \"x\": 140,\n    \"y\": 400,\n    \"wires\": [[\"status-debug\"]]\n  },\n  {\n    \"id\": \"status-debug\",\n    \"type\": \"debug\",\n    \"z\": \"flow-urllc-main\",\n    \"name\": \"Heartbeat\",\n    \"active\": false,\n    \"tosidebar\": true,\n    \"x\": 370,\n    \"y\": 400,\n    \"wires\": []\n  }\n]\n","settings.js":"module.exports = {\n    uiPort: 1880,\n    flowFile: 'flows.json',\n    userDir: '/data',\n    httpAdminRoot: '/',\n    httpNodeRoot: '/api',\n    logging: {\n        console: { level: \"info\", metrics: false, audit: false }\n    },\n    editorTheme: {\n        page: { title: \"URLLC — 5G Edge Telemetry Hub\" }\n    }\n}\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"urllc-nodered-config","namespace":"urllc"}}
