apiVersion: apps/v1
kind: Deployment
metadata:
  name: embb-nginx
  namespace: embb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embb-nginx
  template:
    metadata:
      labels:
        app: embb-nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "300m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: embb-service
  namespace: embb
spec:
  type: NodePort
  selector:
    app: embb-nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007

