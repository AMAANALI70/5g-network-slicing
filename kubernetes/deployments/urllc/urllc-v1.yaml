apiVersion: apps/v1
kind: Deployment
metadata:
  name: urllc-app
  namespace: urllc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urllc-app
  template:
    metadata:
      labels:
        app: urllc-app
    spec:
      containers:
      - name: urllc-container
        image: urllc-app
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: urllc-service
  namespace: urllc
spec:
  type: NodePort
  selector:
    app: urllc-app
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30008

