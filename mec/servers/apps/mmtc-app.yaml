---
# mMTC Slice: Full IoT Stack
# Mosquitto MQTT Broker + Node-RED Subscriber/Processor + InfluxDB Time-Series DB
# Mosquitto and Node-RED run as separate deployments; InfluxDB stores all telemetry

### === MOSQUITTO MQTT BROKER (existing, slightly enhanced) ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mmtc-app
  namespace: mmtc
  labels:
    app: mmtc-app
    slice: mmtc
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mmtc-app
  template:
    metadata:
      labels:
        app: mmtc-app
        slice: mmtc
        tier: application
    spec:
      nodeSelector:
        kubernetes.io/hostname: kube
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0
          ports:
            - containerPort: 1883
              name: mqtt
            - containerPort: 9001
              name: mqtt-ws
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: mosquitto-config
          configMap:
            name: mosquitto-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: mmtc
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    listener 9001 0.0.0.0
    protocol websockets
    allow_anonymous true
    persistence false
    log_type error
    log_type warning
    log_type information
    # Enable $SYS topics for monitoring
    sys_interval 10
---
apiVersion: v1
kind: Service
metadata:
  name: mmtc-app
  namespace: mmtc
  labels:
    app: mmtc-app
    slice: mmtc
spec:
  selector:
    app: mmtc-app
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
      nodePort: 30883
    - name: mqtt-ws
      port: 9001
      targetPort: 9001
      nodePort: 30901
  type: NodePort
---
### === NODE-RED IoT FLOW PROCESSOR ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mmtc-nodered
  namespace: mmtc
  labels:
    app: mmtc-nodered
    slice: mmtc
    tier: processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mmtc-nodered
  template:
    metadata:
      labels:
        app: mmtc-nodered
        slice: mmtc
        tier: processing
    spec:
      nodeSelector:
        kubernetes.io/hostname: kube
      initContainers:
        - name: flows-init
          image: alpine:3.18
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp /config/flows.json /data/flows.json
              cp /config/settings.js /data/settings.js
              chown -R 1000:1000 /data
              echo "mMTC Node-RED config initialized"
          volumeMounts:
            - name: nodered-config
              mountPath: /config
            - name: nodered-data
              mountPath: /data
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      containers:
        - name: node-red
          image: nodered/node-red:latest
          ports:
            - containerPort: 1880
              name: http
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=256"
          volumeMounts:
            - name: nodered-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 1880
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: nodered-config
          configMap:
            name: mmtc-nodered-config
        - name: nodered-data
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mmtc-nodered-config
  namespace: mmtc
data:
  settings.js: |
    module.exports = {
        uiPort: 1880,
        flowFile: 'flows.json',
        userDir: '/data',
        httpAdminRoot: '/',
        httpNodeRoot: '/api',
        logging: { console: { level: "warn" } },
        editorTheme: { page: { title: "mMTC — IoT Telemetry Processor" } }
    }

  flows.json: |
    [
      {
        "id": "flow-mmtc-main",
        "type": "tab",
        "label": "mMTC IoT Processing"
      },
      {
        "id": "mqtt-broker-config",
        "type": "mqtt-broker",
        "name": "Mosquitto Local",
        "broker": "mmtc-app",
        "port": "1883",
        "clientid": "nodered-mmtc-processor",
        "autoConnect": true,
        "usetls": false,
        "keepalive": "60",
        "cleansession": true
      },
      {
        "id": "mqtt-sub-sensors",
        "type": "mqtt in",
        "z": "flow-mmtc-main",
        "name": "All Sensor Data",
        "topic": "sensors/#",
        "qos": "1",
        "broker": "mqtt-broker-config",
        "x": 130,
        "y": 120,
        "wires": [["parse-sensor"]]
      },
      {
        "id": "mqtt-sub-vehicles",
        "type": "mqtt in",
        "z": "flow-mmtc-main",
        "name": "Vehicle Telemetry",
        "topic": "vehicles/#",
        "qos": "1",
        "broker": "mqtt-broker-config",
        "x": 130,
        "y": 200,
        "wires": [["parse-sensor"]]
      },
      {
        "id": "mqtt-sub-heartbeat",
        "type": "mqtt in",
        "z": "flow-mmtc-main",
        "name": "Device Heartbeats",
        "topic": "devices/heartbeat/#",
        "qos": "0",
        "broker": "mqtt-broker-config",
        "x": 130,
        "y": 280,
        "wires": [["count-heartbeats"]]
      },
      {
        "id": "parse-sensor",
        "type": "function",
        "z": "flow-mmtc-main",
        "name": "Parse + Tag",
        "func": "try {\n  var d = typeof msg.payload === 'string' ? JSON.parse(msg.payload) : msg.payload;\n  d._topic = msg.topic;\n  d._ts = Date.now();\n  d._slice = 'mmtc';\n  msg.payload = d;\n} catch(e) {\n  msg.payload = {raw: msg.payload, error: e.message, _ts: Date.now()};\n}\nreturn msg;",
        "outputs": 1,
        "x": 360,
        "y": 160,
        "wires": [["influx-write", "debug-sensor"]]
      },
      {
        "id": "count-heartbeats",
        "type": "function",
        "z": "flow-mmtc-main",
        "name": "Track Devices",
        "func": "context.set('last_hb_' + msg.topic, Date.now());\nmsg.payload = {device: msg.topic, ts: Date.now()};\nreturn msg;",
        "outputs": 1,
        "x": 360,
        "y": 280,
        "wires": [["debug-sensor"]]
      },
      {
        "id": "influx-write",
        "type": "debug",
        "z": "flow-mmtc-main",
        "name": "Telemetry Store (InfluxDB)",
        "active": true,
        "tosidebar": true,
        "console": false,
        "tostatus": false,
        "complete": "payload",
        "x": 600,
        "y": 160,
        "wires": []
      },
      {
        "id": "debug-sensor",
        "type": "debug",
        "z": "flow-mmtc-main",
        "name": "Sensor Debug",
        "active": false,
        "x": 600,
        "y": 280,
        "wires": []
      }
    ]
---
apiVersion: v1
kind: Service
metadata:
  name: mmtc-nodered
  namespace: mmtc
spec:
  selector:
    app: mmtc-nodered
  ports:
    - name: http
      port: 1880
      targetPort: 1880
      nodePort: 30881
  type: NodePort
---
### === INFLUXDB TIME-SERIES DATABASE ===
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: mmtc
  labels:
    app: influxdb
    slice: mmtc
    tier: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
        slice: mmtc
        tier: storage
    spec:
      nodeSelector:
        kubernetes.io/hostname: kube
      containers:
        - name: influxdb
          image: influxdb:1.8-alpine
          ports:
            - containerPort: 8086
              name: http
          env:
            - name: INFLUXDB_DB
              value: mmtc_telemetry
            - name: INFLUXDB_HTTP_AUTH_ENABLED
              value: "false"
            - name: INFLUXDB_DATA_ENGINE
              value: tsm1
            - name: INFLUXDB_REPORTING_DISABLED
              value: "true"
          volumeMounts:
            - name: influxdb-data
              mountPath: /var/lib/influxdb
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /ping
              port: 8086
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: influxdb-data
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: mmtc
spec:
  selector:
    app: influxdb
  ports:
    - name: http
      port: 8086
      targetPort: 8086
      nodePort: 30886
  type: NodePort
