---
# eMBB Slice: nginx HLS Video Streaming Server
# InitContainer generates synthetic HLS content using ffmpeg (no internet needed)
# Serves 3 quality tiers: 360p/720p/1080p via adaptive master playlist
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embb-app
  namespace: embb
  labels:
    app: embb-app
    slice: embb
    tier: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embb-app
  template:
    metadata:
      labels:
        app: embb-app
        slice: embb
        tier: application
    spec:
      nodeSelector:
        kubernetes.io/hostname: kube
      initContainers:
        - name: hls-generator
          image: jrottenberg/ffmpeg:4.4-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /data/hls/360p /data/hls/720p /data/hls/1080p
              echo "Generating 360p HLS (low quality)..."
              ffmpeg -f lavfi -i "testsrc2=duration=300:size=640x360:rate=25" \
                     -f lavfi -i "sine=frequency=440:duration=300:sample_rate=44100" \
                     -c:v libx264 -preset ultrafast -b:v 450k -maxrate 500k -bufsize 1000k \
                     -c:a aac -b:a 64k -ac 2 \
                     -hls_time 4 -hls_list_size 0 -hls_flags independent_segments \
                     -hls_segment_filename '/data/hls/360p/seg%04d.ts' \
                     /data/hls/360p/index.m3u8 -y 2>&1 | tail -3
              echo "Generating 720p HLS (medium quality)..."
              ffmpeg -f lavfi -i "testsrc2=duration=300:size=1280x720:rate=25" \
                     -f lavfi -i "sine=frequency=660:duration=300:sample_rate=44100" \
                     -c:v libx264 -preset ultrafast -b:v 1800k -maxrate 2000k -bufsize 4000k \
                     -c:a aac -b:a 128k -ac 2 \
                     -hls_time 4 -hls_list_size 0 -hls_flags independent_segments \
                     -hls_segment_filename '/data/hls/720p/seg%04d.ts' \
                     /data/hls/720p/index.m3u8 -y 2>&1 | tail -3
              echo "Generating 1080p HLS (high quality)..."
              ffmpeg -f lavfi -i "testsrc2=duration=300:size=1920x1080:rate=25" \
                     -f lavfi -i "sine=frequency=880:duration=300:sample_rate=44100" \
                     -c:v libx264 -preset ultrafast -b:v 3800k -maxrate 4200k -bufsize 8400k \
                     -c:a aac -b:a 192k -ac 2 \
                     -hls_time 4 -hls_list_size 0 -hls_flags independent_segments \
                     -hls_segment_filename '/data/hls/1080p/seg%04d.ts' \
                     /data/hls/1080p/index.m3u8 -y 2>&1 | tail -3
              cat > /data/hls/master.m3u8 << 'PLAYLIST'
              #EXTM3U
              #EXT-X-VERSION:3
              #EXT-X-STREAM-INF:BANDWIDTH=514000,RESOLUTION=640x360,CODECS="avc1.42e01e,mp4a.40.2"
              360p/index.m3u8
              #EXT-X-STREAM-INF:BANDWIDTH=1928000,RESOLUTION=1280x720,CODECS="avc1.42e01e,mp4a.40.2"
              720p/index.m3u8
              #EXT-X-STREAM-INF:BANDWIDTH=3992000,RESOLUTION=1920x1080,CODECS="avc1.42e01e,mp4a.40.2"
              1080p/index.m3u8
              PLAYLIST
              # Fix whitespace in playlist
              sed -i 's/^              //' /data/hls/master.m3u8
              ls -lh /data/hls/
              echo "HLS generation complete. Ready to serve."
          volumeMounts:
            - name: hls-data
              mountPath: /data
          resources:
            requests:
              cpu: "2000m"
              memory: "512Mi"
            limits:
              cpu: "4000m"
              memory: "1Gi"
      containers:
        - name: nginx-hls
          image: nginx:alpine
          ports:
            - containerPort: 8080
              name: hls
          volumeMounts:
            - name: hls-data
              mountPath: /usr/share/nginx/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /hls/master.m3u8
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: hls-data
          emptyDir:
            sizeLimit: 2Gi
        - name: nginx-config
          configMap:
            name: embb-nginx-hls-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: embb-nginx-hls-config
  namespace: embb
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # HLS streaming headers
        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header X-Slice-Type eMBB;
            # Enable byte-range for segment fetching
            add_header Accept-Ranges bytes;
        }

        # Status endpoint for monitoring
        location /status {
            stub_status on;
            access_log off;
        }

        # Health check
        location /healthz {
            return 200 "eMBB HLS OK\n";
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: embb-app
  namespace: embb
  labels:
    app: embb-app
    slice: embb
spec:
  selector:
    app: embb-app
  ports:
    - name: hls
      port: 8080
      targetPort: 8080
      nodePort: 30880
  type: NodePort
