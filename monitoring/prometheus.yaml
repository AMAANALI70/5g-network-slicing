---
# ============================================================
# Prometheus — ConfigMap (scrape config)
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: 'tun-metrics'
        static_configs:
          - targets: ['192.168.49.171:9100']
            labels:
              instance: 'kube-worker1'
          - targets: ['192.168.49.181:9100']
            labels:
              instance: 'kube-worker2'

      - job_name: 'qos-orchestrator'
        scrape_interval: 5s
        static_configs:
          - targets: ['192.168.49.174:9200']
            labels:
              instance: 'orchestrator'

      # Note: embb-nginx scrape removed — NodePort routing unavailable from Prometheus pod.
      # eMBB throughput is captured by tun-metrics (tun_rx_bytes{slice="embb"}).

      # Note: slice-app-metrics (ports 30114/30115) removed — exporters not deployed.
      # Use orchestrator_* metrics for URLLC/mMTC app-level observability.

      # cAdvisor (kubelet) — container CPU, memory by namespace
      - job_name: 'kubelet-cadvisor'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/cadvisor
        static_configs:
          - targets:
            - '192.168.49.171:10250'
            - '192.168.49.181:10250'
            - '192.168.49.174:10250'

      # kubelet resource metrics
      - job_name: 'kubelet-resource'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/resource
        static_configs:
          - targets:
            - '192.168.49.171:10250'
            - '192.168.49.181:10250'
            - '192.168.49.174:10250'

---
# ============================================================
# Prometheus — Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      nodeSelector:
        kubernetes.io/hostname: kubemaster
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=7d'
            - '--web.listen-address=:9090'
            - '--web.enable-lifecycle'
          ports:
            - containerPort: 9090
              name: web
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir:
            sizeLimit: 1Gi

---
# ============================================================
# Prometheus — Service (NodePort for access)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      nodePort: 30090
